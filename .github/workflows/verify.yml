name: verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip
      - run: pip install -e ".[demo]"

      # Run a short certified training demo to produce a proofpack
      - run: vireon-proofpacks train --steps 500 --seed 1

      # Verify the produced proofpack(s)
      - run: vireon-proofpacks verify results/CERTPPO_CARTPOLE_RUN_*
